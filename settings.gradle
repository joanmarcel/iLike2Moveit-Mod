pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// common/ is NOT a subproject: each loader adds it as a source directory. Applying the Java plugin
// would require disabling its compilation because it has no Minecraft classes on its own classpath.
include 'neoforge'
include 'fabric'
