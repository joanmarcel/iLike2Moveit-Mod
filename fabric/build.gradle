plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'idea'
}

base {
    archivesName = 'iLike2MoveIt-fabric'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Shared code. common/ is not a subproject; it is compiled here with Loom mappings and its own Mixin
// refmap.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    // Same rule as neoforge/: use the Modrinth VERSION ID, not the version number. Modrinth reuses
    // version_number across loaders and its Maven can return any one of them. The IDs below select
    // Fabric 1.21.1 explicitly.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojmap + Parchment: the same mappings as neoforge/. Without this, common cannot compile for
    // both loaders because Yarn uses different Minecraft names.
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly 'maven.modrinth:entity-model-features:NLDNY8vg'   // 3.2.4-fabric-1.21
    modCompileOnly 'maven.modrinth:entitytexturefeatures:udcdeUXw'   // 7.1-fabric-1.21
    modCompileOnly 'maven.modrinth:vanillabackport:ayvoY8lx'         // 1.1.7.10 fabric
    modCompileOnly 'maven.modrinth:platform:BbIdNbF1'                // 1.3.3 fabric

    // Also load them in the development client so it starts without manually copying jars. NeoForge
    // gets them from run/mods/; Fabric lets the build resolve them here. They are not bundled in the
    // published jar because modLocalRuntime is not a declared mod dependency.
    modLocalRuntime 'maven.modrinth:entity-model-features:NLDNY8vg'
    modLocalRuntime 'maven.modrinth:entitytexturefeatures:udcdeUXw'
    modLocalRuntime 'maven.modrinth:vanillabackport:ayvoY8lx'
    modLocalRuntime 'maven.modrinth:platform:BbIdNbF1'
    // Puzzle is not a mod dependency, but it IS a test-client dependency: without it, _hand models are
    // not baked and held items appear as magenta cubes. tools/verify_client.py seeds a minimum of SIX
    // NeoForge mods, not four; this is the fifth.
    modLocalRuntime 'maven.modrinth:puzzle:DuV4z8Sp'                 // 2.3.0+1.21.1-fabric
    // Puzzle Fabric DOES require MidnightLib; without it the client crashes in its entrypoint with
    // NoClassDefFoundError: eu/midnightdust/lib/config/MidnightConfig. The playbook says Puzzle does
    // not depend on MidnightLib, but that applies to the NeoForge build, not this one.
    modLocalRuntime 'maven.modrinth:midnightlib:as2ZKoB1'            // 1.9.3+1.21.1-fabric
    // Modefite is the sixth: without it, trade-show items look flat instead of 3D. Its Modrinth slug is
    // NOT "modefite" (that search returns nothing), but the one below, the same kind of trap as ETF's
    // "entitytexturefeatures". The NeoForge jar in run/mods is named modefite.jar and only contains
    // neoforge.mods.toml, so it cannot reveal the slug either.
    modLocalRuntime 'maven.modrinth:modefite-item-definition-backport:XG0Uwv8m'   // 1.0.1+1.21.1
}

loom {
    runs {
        client {
            // Relative to the subproject projectDir, resolving to <root>/run-fabric. It is intentionally
            // separate from the NeoForge instance because mods/ cannot contain jars for both loaders.
            runDir = '../run-fabric'
        }
    }
}

processResources {
    // Capture the version in a local ON PURPOSE: `expand` runs during execution, and reading
    // `project.version` inside its closure makes the configuration cache (enabled in
    // gradle.properties) abort with "invocation of 'project' ... is unsupported".
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
