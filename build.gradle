plugins {
    id 'idea'
}

// The root project builds nothing directly; it only coordinates the loader subprojects.
allprojects {
    version = mod_version
    group = mod_group_id
}

// Gradle already registers `wrapper` on the root project; configure it instead of declaring it again.
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// A successful build does not prove that the jars contain everything they need. Missing any of these
// entries silently breaks the mod: without mixins.json no mixins run, and loader metadata or the
// particle asset can otherwise disappear unnoticed.
def jarMustContain = [
        neoforge: ['META-INF/neoforge.mods.toml'],
        fabric  : ['fabric.mod.json'],
]
def sharedEntries = [
        'ilike2moveit.mixins.json',
        'mac/ilike2moveit/ILike2MoveIt.class',
        'mac/ilike2moveit/mixin/CrossedArmsItemLayerMixin.class',
        'mac/ilike2moveit/mixin/PigRestingMixin.class',
        'mac/ilike2moveit/mixin/PigAiThrottleMixin.class',
        'mac/ilike2moveit/MoveItCore.class',
        'mac/ilike2moveit/network/ServerBridgePayload.class',
        'mac/ilike2moveit/pig/PigRestingController.class',
        'mac/ilike2moveit/rabbit/RabbitAnimationBridge.class',
        'assets/ilike2moveit/particles/fox_zzz.json',
]

// Resolve paths HERE during configuration. The configuration cache enabled in gradle.properties
// forbids calling `file(...)` from an execution closure ("invocation of 'file' references a Gradle
// script object ... is unsupported"): doLast may only use pre-resolved Files, not the Project object.
def libsDirs = jarMustContain.collectEntries { loader, ownEntries ->
    [(loader): file("${loader}/build/libs")]
}

tasks.register('verifyJars') {
    group = 'verification'
    description = 'Checks that both jars contain their mixins, metadata and assets.'
    dependsOn ':neoforge:build', ':fabric:build'
    doLast {
        jarMustContain.each { loader, ownEntries ->
            def libs = libsDirs[loader]
            // Each libs/ currently has one jar (Loom puts the -dev.jar in build/devlibs/), but enabling
            // a sources or javadoc jar would add another one. This filter guarantees that verification
            // inspects the publishable jar rather than one of its siblings.
            def jar = libs.listFiles()?.find {
                it.name.endsWith('.jar') && !it.name.contains('-sources') && !it.name.contains('-dev')
            }
            if (jar == null) {
                throw new GradleException("No jar found in ${libs}")
            }
            def names = new java.util.zip.ZipFile(jar).entries().collect { it.name } as Set
            (ownEntries + sharedEntries).each { entry ->
                if (!names.contains(entry)) {
                    throw new GradleException("${jar.name} does not contain ${entry}")
                }
            }
            println "OK ${jar.name}: ${(ownEntries + sharedEntries).size()} required entries present"
        }
    }
}

// syncLegacyJarPath used to copy the NeoForge jar into the root build/libs/ because
// publish_public.py looked there. It was only a bridge until the publisher learned the multiloader
// layout. Removing it also removes the stale-artifact risk that required Sync instead of Copy: the
// root does not apply the base plugin and therefore has no clean task, so an old jar could survive
// there and be published silently.
tasks.register('build') {
    group = 'build'
    description = 'Builds both loaders and verifies that their jars contain all required entries.'
    dependsOn 'verifyJars'
}
