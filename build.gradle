plugins {
    id 'idea'
}

// The root project builds nothing directly; it only coordinates the loader subprojects.
allprojects {
    version = mod_version
    group = mod_group_id
}

// Gradle already registers `wrapper` on the root project; configure it instead of declaring it again.
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// A successful build does not prove that the jars contain everything they need. Missing any of these
// entries silently breaks the mod: without mixins.json no mixins run, and loader metadata or the
// particle asset can otherwise disappear unnoticed.
def jarMustContain = [
        neoforge: ['META-INF/neoforge.mods.toml'],
        fabric  : ['fabric.mod.json', 'ilike2moveit.refmap.json'],
]
def sharedEntries = [
        'ilike2moveit.mixins.json',
        'mac/ilike2moveit/ILike2MoveIt.class',
        'mac/ilike2moveit/mixin/CrossedArmsItemLayerMixin.class',
        'mac/ilike2moveit/mixin/IronGolemFlowerLayerMixin.class',
        'mac/ilike2moveit/mixin/EmfLivingEntityRenderScopeMixin.class',
        'mac/ilike2moveit/mixin/EmfModelPartRenderPassMixin.class',
        'mac/ilike2moveit/mixin/EmfAttachmentCaptureMixin.class',
        'mac/ilike2moveit/render/RenderedAttachmentCaptureScope.class',
        'mac/ilike2moveit/mixin/SheepWoolUndercoatLayerMixin.class',
        'mac/ilike2moveit/sheep/SheepUndercoatCompat.class',
        'mac/ilike2moveit/mixin/SheepModelVariantMixin.class',
        'mac/ilike2moveit/mixin/SheepRendererModelVariantMixin.class',
        'mac/ilike2moveit/mixin/SheepFurModelVariantMixin.class',
        'mac/ilike2moveit/sheep/SheepAlternateModelAccess.class',
        'mac/ilike2moveit/sheep/SheepVariantCompat.class',
        'mac/ilike2moveit/mixin/VillagerProfessionLayerMixin.class',
        'mac/ilike2moveit/mixin/PigRestingMixin.class',
        'mac/ilike2moveit/mixin/PigAiThrottleMixin.class',
        'mac/ilike2moveit/mixin/CatModelVariantMixin.class',
        'mac/ilike2moveit/mixin/CatCollarModelVariantMixin.class',
        'mac/ilike2moveit/mixin/CatRendererYawLockMixin.class',
        'mac/ilike2moveit/cat/CatVariantCompat.class',
        'mac/ilike2moveit/mixin/WolfModelVariantMixin.class',
        'mac/ilike2moveit/mixin/WolfCollarModelVariantMixin.class',
        'mac/ilike2moveit/mixin/WolfArmorModelVariantMixin.class',
        'mac/ilike2moveit/mixin/WolfRendererYawLockMixin.class',
        'mac/ilike2moveit/wolf/WolfVariantCompat.class',
        'mac/ilike2moveit/mixin/OcelotRendererModelVariantMixin.class',
        'mac/ilike2moveit/mixin/RabbitRendererModelVariantMixin.class',
        'mac/ilike2moveit/render/RendererModelSwapStack.class',
